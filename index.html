<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Authenticator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <div class="glass-card">
            <h1 class="title"><span class="icon">🔐</span> 2FA Authenticator</h1>
            
            <form id="generateCodeForm">
                <div class="input-group">
                    <label for="secret">Secret Key</label>
                    <input type="text" id="secret" placeholder="Enter Base32 secret" required autocomplete="off">
                    <button type="button" id="pasteBtn" title="Paste">📋</button>
                </div>
                
                <button type="submit" class="btn-generate">Generate Code</button>
            </form>

            <div id="result"></div>

            <p class="footer">Your data stays on your device</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
